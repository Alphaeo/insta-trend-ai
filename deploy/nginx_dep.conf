server {
    listen 80;
    server_name localhost;

    # Configuration pour le frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Désactiver la mise en cache pour le développement
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        
        # Temps d'attente plus longs pour le développement
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # ATTENTION: Ne pas intercepter /assets pour éviter de bloquer les assets du frontend
    # Si vous devez servir des fichiers depuis MinIO, utilisez un préfixe distinct, par ex. /uploads/
    # Exemple:
    # location /uploads/ {
    #     proxy_pass http://minio:9000/uploads/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     expires 30d;
    #     add_header Cache-Control "public, no-transform";
    # }

    # Configuration pour les WebSockets
    location /api/chat/ws {
        proxy_pass http://backend:8000/chat/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts pour maintenir la connexion ouverte
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_connect_timeout 1d;
    }

    # Configuration pour l'API backend (hors WebSocket)
    location /api/ {
        # Supprime le préfixe /api avant d'envoyer au backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
