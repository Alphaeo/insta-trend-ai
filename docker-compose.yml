version: '3.8'
services:
  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  redis:
    image: redis:7
    networks:
      - app-network

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app-network

  backend:
    build: ./backend
    env_file: ./backend/env/backend.env
    depends_on: [mongo, redis, minio]
    expose:
      - "8000"
    networks:
      - app-network

  worker:
    build: ./backend
    env_file: ./backend/env/backend.env
    command: celery -A app.celery_app worker --loglevel=info
    depends_on: [backend, redis, mongo]
    networks:
      - app-network

  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=/api  # Utilisation du chemin relatif via Nginx
    expose:
      - "80"
    networks:
      - app-network


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx_dep.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  minio_data:

